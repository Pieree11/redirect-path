<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Link Expired or Not Found</title>
    <style>
        body {
            background-color: #f4f6f9;
            color: #333;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 420px;
        }
        .error-code {
            font-size: 56px;
            font-weight: bold;
            color: #ff3b30;
            margin: 0 0 10px 0;
        }
        h1 { font-size: 20px; color: #1a1a1a; margin: 0 0 10px 0; }
        p { font-size: 14px; color: #666; line-height: 1.6; margin: 0; }
    </style>
</head>
<body>

<div class="card">
    <div class="error-code">404</div>
    <h1>Link Expired or Invalid</h1>
    <p>The secure routing path you are trying to access has either expired, been moved, or does not exist. Please double-check the URL pattern and try again.</p>
</div>

</body>
</html>
